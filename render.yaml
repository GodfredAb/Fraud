services:
  - type: web
    name: momo-fraud-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MOMO_FRAUD_DSN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

# monitor.py and feeder.py are run locally instead of as Render workers -
# Render has no free tier for background workers (~$7/mo each on Starter).
# Point them at the same Neon DSN as the API:
#   python monitor/monitor.py --dsn "<neon-dsn>"
#   python feeder/feeder.py --dsn "<neon-dsn>"
