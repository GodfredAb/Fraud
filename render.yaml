services:
  - type: web
    name: momo-fraud-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MOMO_FRAUD_DSN
        sync: false

  # Static frontend, same account/dashboard as the API above - no second
  # platform needed. Render's static-site hosting is free with no sleep
  # behavior (unlike the API web service above, which does sleep on the
  # free plan). VITE_API_URL must be set to the API service's URL AFTER
  # it's deployed once (see README/chat instructions) - Vite bakes env
  # vars in at BUILD time, so this has to be set before this service's
  # first build, or you'll need to trigger a manual redeploy after setting it.
  - type: web
    name: momo-fraud-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false

# monitor.py and feeder.py are run locally (or from any machine), pointed
# at the same Neon DSN as the API - Render's free tier has no background
# worker option:
#   python monitor/monitor.py --dsn "<neon-dsn>"
#   python feeder/feeder.py --dsn "<neon-dsn>"
