services:
  - type: web
    name: momo-fraud-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MOMO_FRAUD_DSN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: worker
    name: momo-fraud-monitor
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python monitor/monitor.py
    envVars:
      - key: MOMO_FRAUD_DSN
        sync: false

  - type: worker
    name: momo-fraud-feeder
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python feeder/feeder.py
    envVars:
      - key: MOMO_FRAUD_DSN
        sync: false
